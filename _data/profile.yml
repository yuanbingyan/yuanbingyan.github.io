short_bio: >-
  <p>
    I am a second-year Master student in the College of Artificial Intelligence at China University of Petroleum, Beijing,
    where I conduct research in the intersection of Computer Vision and Generative Models under the supervision of Prof. Yaru Xue.
    Prior to that, I received my B.S. in Telecommunication Engineering from Zhengzhou University.
  </p>
  <p>
    My research interests lie broadly in developing generative model, and use them to solve computer vision problems,
    with a current focus on medical inverse problem solving.
  </p>
  <p>
    Outside of my academic work, I am a passionate self-learner with a strong curiosity for various areas across computer science.
  </p>

